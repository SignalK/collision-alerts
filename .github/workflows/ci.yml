name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    uses: SignalK/signalk-server/.github/workflows/plugin-ci.yml@master
    with:
      # Node 24 is the lowest supported (engines), 26 the newest.
      node-versions: '["24", "26"]'
      enable-signalk-integration: true
      format-check-command: npm run ci-lint

  # Workflow expressions are only checked when a job runs, and the publish
  # job only runs on a release, so lint them on every change.
  actionlint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Lint workflows
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color

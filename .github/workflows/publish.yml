name: Publish

on:
  # release-please dispatches this at the tag it created; a hand-pushed tag
  # triggers it directly.
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

jobs:
  publish:
    if: github.repository == 'SignalK/collision-alerts'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Validate version is strict semver
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # MAJOR.MINOR.PATCH with optional -prerelease and +build (semver.org BNF)
          if ! printf '%s' "$VERSION" | grep -Eq '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'; then
            echo "::error::Tag '$GITHUB_REF_NAME' is not strict semver - refusing to publish."
            exit 1
          fi
          case "$VERSION" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build
      - run: npm test

      - name: Publish (OIDC trusted publishing, no token)
        run: |
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            npm publish --provenance --access public --tag beta
          else
            npm publish --provenance --access public
          fi

  # release-please creates its own Release; only a hand-pushed tag needs one.
  release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ needs.publish.outputs.prerelease == 'true' }}
